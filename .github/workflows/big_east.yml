name: Weekly TFRRS Scrape - Big East Conference

on:
  schedule:
  # Min Hr Day Mon WkDay
    - cron: "0 5 * * 1" # 5am because UTC not EST

  # Add button so we can test the workflow manually
  workflow_dispatch:

permissions:
# Grants permission to write output file
  contents: write

jobs:
  scrape:
  # Ubuntu is a temporary computer created by Github
  # This allows us to run the scraper automatically without our actual computer being on
  # -latest uses the latest version
    runs-on: ubuntu-latest

    steps:
    # name: what you see in the Actions page
    # uses: calls Github function, where @v5 means version 5
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: | # Everything after this will be run in the shell
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_big_east.py

      - name: Confirm output file exists
        run: |
          if [ ! -f "big_east_tfrrs_performances.csv" ]; then
            echo "ERROR: CSV file not created."
            exit 1
          fi

      - name: Upload Big East CSV # to github
        uses: actions/upload-artifact@v4
        with:
          name: big_east_tfrrs_performances
          path: big_east_tfrrs_performances.csv
